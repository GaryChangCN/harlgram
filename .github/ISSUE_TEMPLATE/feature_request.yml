name: 功能建议 / Feature request
description: 描述用户场景和可验收的范围。 Describe a user need and a testable scope.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先查看 [Web A 对齐清单](https://github.com/GaryChangCN/harlgram/blob/main/docs/TELEGRAM_WEB_PARITY.md) 和现有 Issue。
        Check the parity matrix and existing issues first. The app uses native HarmonyOS UI; matching a feature does not require copying its web layout.
  - type: textarea
    id: need
    attributes:
      label: 要解决的问题 / User need
      description: 描述使用场景和当前阻碍，不包含真实消息或账号信息。 Use a fictional example.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 期望行为 / Proposed behavior
      description: 说明成功、取消和失败时应该发生什么。 Describe success, cancellation, and failure behavior.
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 参考与范围 / Reference and scope
      description: 可提供矩阵编号、官方文档或去敏参考。区分已观察行为与设想，注明权限限制。 Include matrix IDs or public references; distinguish observation from proposals.
  - type: textarea
    id: acceptance
    attributes:
      label: 验收方式 / Acceptance criteria
      description: 如何确认功能满足需要？涉及哪些设备形态或窗口？ How would you verify it, and on which form factors?
